name: Hassfest

on:
  push:
    paths:
      - "custom_components/**"
      - ".github/workflows/hassfest.yaml"
  pull_request:
    paths:
      - "custom_components/**"
      - ".github/workflows/hassfest.yaml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master
