name: Python

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/python.yaml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - ".github/workflows/python.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant test target and pytest
        run: python -m pip install "homeassistant==2026.10.4" pytest
      - name: Run pure model and report tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q tests/test_core.py
      - name: Compile integration modules
        run: python -m compileall -q custom_components/device_care
